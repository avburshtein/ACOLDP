name = "ai-orchestrator-api"
main = "worker/index.js"
compatibility_date = "2024-01-01"
compatibility_flags = ["nodejs_compat"]

# Worker will be available at:
# https://ai-orchestrator-api.YOUR_SUBDOMAIN.workers.dev
# Or bind to custom domain in Cloudflare Dashboard

# ── CORS ────────────────────────────────────────────────────────────────
# Worker отвечает только перечисленным Origin (см. DEFAULT_ORIGINS в
# worker/index.js). Чтобы переопределить без правки кода, раскомментируйте
# [vars] ниже — список Origin через запятую. Нужно при смене домена или
# для проверки конкретного preview-деплоя Pages (у каждого свой поддомен).
#
# [vars]
# ALLOWED_ORIGINS = "https://ai.orchestrator.ux42.studio,http://localhost:5173"
